<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071827"><title>لوحة إدارة الواجهة البحرية</title><link rel="stylesheet" href="admin.css?v=4"></head><body>
<div id="authView" class="auth-screen"><div class="auth-card"><div class="logo">الواجهة البحرية</div><h1>لوحة التحكم</h1><p>سجّل الدخول لإدارة المنيو.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required></label><label>كلمة المرور<input id="password" type="password" required></label><button class="primary" type="submit">تسجيل الدخول</button><div id="loginMessage" class="message"></div></form></div></div>
<div id="appView" class="app hidden"><header class="topbar"><div><strong>الواجهة البحرية</strong><span>لوحة الإدارة</span></div><div class="top-actions"><a href="index.html" target="_blank">عرض المنيو</a><button id="logoutBtn">تسجيل الخروج</button></div></header><main class="dashboard"><div class="stats"><div><b id="catCount">0</b><span>الأقسام</span></div><div><b id="productCount">0</b><span>المنتجات</span></div></div>
<section class="panel"><div class="panel-head"><h2>معلومات المطعم</h2><button id="saveSite" class="primary">حفظ</button></div><div class="form-grid"><label>اسم المطعم بالعربي<input id="siteName"></label><label>اسم المطعم English<input id="siteNameEn" placeholder="AL WAJHA AL BAHRIYA"></label><label>الوصف بالعربي<input id="siteTagline"></label><label>الوصف English<input id="siteTaglineEn"></label><label>صورة الغلاف<input id="heroImage" placeholder="رابط Cloudinary أو أي صورة"><button type="button" id="uploadHeroBtn" class="upload-btn">☁ رفع صورة الغلاف</button></label><label>الهاتف<input id="sitePhone"></label><label>Instagram URL<input id="siteInstagram"></label><label>رابط الموقع/Google Maps<input id="siteLocation"></label></div></section>
<section class="panel"><div class="panel-head"><h2>الأقسام</h2><button id="addCategory" class="primary">+ إضافة قسم</button></div><div id="categoriesList" class="list"></div></section>
<section class="panel"><div class="panel-head"><h2>المنتجات</h2><button id="addProduct" class="primary">+ إضافة منتج</button></div><div id="productsList" class="list"></div></section></main></div>
<dialog id="categoryDialog"><form method="dialog" id="categoryForm" class="dialog-card"><div class="dialog-titlebar"><h3 id="categoryDialogTitle">إضافة قسم</h3><button type="button" class="dialog-x" data-close-dialog="categoryDialog" aria-label="إغلاق">×</button></div><input type="hidden" id="categoryId"><label>اسم القسم بالعربي<input id="categoryName" required></label><label>اسم القسم English<input id="categoryNameEn" placeholder="Main Dishes"></label><label>أيقونة القسم<input id="categoryIcon" placeholder="✦  🍽  ☕  🥗"></label><label>الترتيب<input id="categoryOrder" type="number" value="0"></label><label class="check"><input id="categoryVisible" type="checkbox" checked> ظاهر للزبائن</label><div class="dialog-actions"><button value="cancel">إلغاء</button><button id="saveCategory" class="primary" value="default">حفظ</button></div></form></dialog>
<dialog id="productDialog"><form method="dialog" id="productForm" class="dialog-card"><div class="dialog-titlebar"><h3 id="productDialogTitle">إضافة منتج</h3><button type="button" class="dialog-x" data-close-dialog="productDialog" aria-label="إغلاق">×</button></div><input type="hidden" id="productId"><div class="form-grid"><label>اسم المنتج بالعربي<input id="productName" required></label><label>Product Name<input id="productNameEn"></label><label>القسم<select id="productCategory" required></select></label><label>السعر<input id="productPrice" type="number" min="0" step="0.01" required></label><label>الوصف بالعربي<textarea id="productDescription" rows="3"></textarea></label><label>English Description<textarea id="productDescriptionEn" rows="3"></textarea></label><label>صورة المنتج<input id="productImage" placeholder="رابط Cloudinary أو أي صورة"><button type="button" id="uploadProductBtn" class="upload-btn">☁ رفع صورة المنتج</button></label><label>الشارة<select id="productBadge"><option value="">بدون شارة</option><option value="جديد">✨ جديد</option><option value="مميز">★ مميز</option><option value="الأكثر طلبًا">🔥 الأكثر طلبًا</option><option value="خاص">👑 خاص</option></select></label><label>الترتيب<input id="productOrder" type="number" value="0"></label><label class="check"><input id="productVisible" type="checkbox" checked> ظاهر للزبائن</label></div><div class="dialog-actions"><button value="cancel">إلغاء</button><button id="saveProduct" class="primary" value="default">حفظ المنتج</button></div></form></dialog>
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script><script type="module" src="admin.js?v=5"></script></body></html>
