<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071827"><title>لوحة إدارة الواجهة البحرية</title><link rel="stylesheet" href="admin.css?v=3"></head><body>
<div id="authView" class="auth-screen"><div class="auth-card"><div class="logo">الواجهة البحرية</div><h1>لوحة التحكم</h1><p>سجّل الدخول لإدارة المنيو.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required></label><label>كلمة المرور<input id="password" type="password" required></label><button class="primary" type="submit">تسجيل الدخول</button><div id="loginMessage" class="message"></div></form></div></div>
<div id="appView" class="app hidden"><header class="topbar"><div><strong>الواجهة البحرية</strong><span>لوحة الإدارة</span></div><div class="top-actions"><a href="index.html" target="_blank">عرض المنيو</a><button id="logoutBtn">تسجيل الخروج</button></div></header><main class="dashboard"><div class="stats"><div><b id="catCount">0</b><span>الأقسام</span></div><div><b id="productCount">0</b><span>المنتجات</span></div></div>
<section class="panel"><div class="panel-head"><h2>معلومات المطعم</h2><button id="saveSite" class="primary">حفظ</button></div><div class="form-grid"><label>اسم المطعم<input id="siteName"></label><label>الوصف المختصر<input id="siteTagline"></label><label>صورة الغلاف URL<input id="heroImage"></label><label>الهاتف<input id="sitePhone"></label><label>Instagram URL<input id="siteInstagram"></label><label>رابط الموقع/Google Maps<input id="siteLocation"></label></div></section>
<section class="panel"><div class="panel-head"><h2>الأقسام</h2><button id="addCategory" class="primary">+ إضافة قسم</button></div><div id="categoriesList" class="list"></div></section>
<section class="panel"><div class="panel-head"><h2>المنتجات</h2><button id="addProduct" class="primary">+ إضافة منتج</button></div><div id="productsList" class="list"></div></section></main></div>
<dialog id="categoryDialog"><form method="dialog" id="categoryForm" class="dialog-card"><h3 id="categoryDialogTitle">إضافة قسم</h3><input type="hidden" id="categoryId"><label>اسم القسم<input id="categoryName" required></label><label>الترتيب<input id="categoryOrder" type="number" value="0"></label><label class="check"><input id="categoryVisible" type="checkbox" checked> ظاهر للزبائن</label><div class="dialog-actions"><button value="cancel">إلغاء</button><button id="saveCategory" class="primary" value="default">حفظ</button></div></form></dialog>
<dialog id="productDialog"><form method="dialog" id="productForm" class="dialog-card"><h3 id="productDialogTitle">إضافة منتج</h3><input type="hidden" id="productId"><label>اسم المنتج<input id="productName" required></label><label>القسم<select id="productCategory" required></select></label><label>السعر<input id="productPrice" type="number" min="0" step="0.01" required></label><label>الوصف<textarea id="productDescription" rows="3"></textarea></label><label>صورة المنتج URL<input id="productImage"></label><label>شارة صغيرة<input id="productBadge" placeholder="جديد / الأكثر طلبًا"></label><label>الترتيب<input id="productOrder" type="number" value="0"></label><label class="check"><input id="productVisible" type="checkbox" checked> ظاهر للزبائن</label><div class="dialog-actions"><button value="cancel">إلغاء</button><button id="saveProduct" class="primary" value="default">حفظ</button></div></form></dialog>
<script type="module" src="admin.js?v=3"></script></body></html>
